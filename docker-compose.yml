version: "3.9"

services:
  bucktooth:
    build:
      context: .
      args:
        VERSION: "0.13.0"
    ports:
      - "8080:8080"
      - "18789:18789"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # signal-cli sidecar — uncomment to enable the Signal channel.
  # Requires a registered phone number; see docs/channels.md for setup.
  #
  # signal-cli:
  #   image: bbernhard/signal-cli-rest-api:latest
  #   environment:
  #     - MODE=json-rpc
  #   volumes:
  #     - signal_data:/home/.local/share/signal-cli
  #   ports:
  #     - "8080:8080"   # signal-cli REST/JSON-RPC
  #   restart: unless-stopped

volumes:
  redis_data:
  # signal_data:
